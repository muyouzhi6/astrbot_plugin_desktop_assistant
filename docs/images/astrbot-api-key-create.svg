<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AstrBot 创建 API Key</title>
  <desc id="desc">展示在 AstrBot 设置页面中创建 OpenAPI API Key 的位置。</desc>
  <rect width="1200" height="620" rx="20" fill="#202224"/>
  <rect x="0" y="0" width="126" height="620" fill="#16181b"/>
  <text x="26" y="42" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">AstrBot</text>
  <rect x="14" y="492" width="98" height="34" rx="8" fill="#0e2a3d" stroke="#ff2020" stroke-width="4"/>
  <text x="42" y="515" fill="#40b6ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700">设置</text>
  <text x="160" y="70" fill="#f5f7fb" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700">设置 -> API Key</text>
  <text x="160" y="105" fill="#aeb6c2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16">创建用于桌面客户端的 OpenAPI API Key, 建议勾选 chat 与 file 权限。</text>
  <rect x="160" y="150" width="940" height="310" rx="14" fill="#25282d" stroke="#363c45"/>
  <text x="190" y="196" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700">开发者访问密钥</text>
  <rect x="190" y="220" width="360" height="42" rx="8" fill="#1b1e23" stroke="#4b535f"/>
  <text x="210" y="247" fill="#8993a2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">Key 名称, 例如 taotao-desktop</text>
  <rect x="570" y="220" width="160" height="42" rx="8" fill="#1b1e23" stroke="#4b535f"/>
  <text x="594" y="247" fill="#dce3ed" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">有效期 30 天</text>
  <rect x="766" y="205" width="220" height="72" rx="10" fill="none" stroke="#ff2020" stroke-width="5"/>
  <rect x="800" y="220" width="142" height="42" rx="8" fill="#3498db"/>
  <text x="824" y="247" fill="#fff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700">创建 API Key</text>
  <text x="190" y="314" fill="#dce3ed" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">权限范围</text>
  <rect x="190" y="334" width="72" height="34" rx="17" fill="#3498db"/>
  <text x="212" y="356" fill="#fff" font-family="Consolas, monospace" font-size="14">chat</text>
  <rect x="274" y="334" width="64" height="34" rx="17" fill="#3498db"/>
  <text x="294" y="356" fill="#fff" font-family="Consolas, monospace" font-size="14">file</text>
  <rect x="350" y="334" width="82" height="34" rx="17" fill="#3498db"/>
  <text x="372" y="356" fill="#fff" font-family="Consolas, monospace" font-size="14">config</text>
  <rect x="444" y="334" width="54" height="34" rx="17" fill="#3498db"/>
  <text x="462" y="356" fill="#fff" font-family="Consolas, monospace" font-size="14">im</text>
  <rect x="190" y="395" width="780" height="44" rx="8" fill="#1b1e23"/>
  <text x="214" y="423" fill="#dce3ed" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">创建后复制 abk_ 开头的完整密钥, 粘贴到桌面客户端 API Key 输入框。</text>
</svg>
